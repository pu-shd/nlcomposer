name: Validate

# Required status check. Validates template.lock against the engine's tag and
# this deployment's config against the pinned engine, with no Azure access.
# Engine bump PRs get this check as a commit status from the update check.
# No workflow_dispatch: a manual run on main would execute engine code with
# write access to the default-branch cache (CodeQL cache-poisoning).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    env:
      UNIT: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify template.lock
        id: lock
        run: tools/lock.sh template.lock
      - name: Check out the pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pu-shd/nlcomposer
          ref: ${{ steps.lock.outputs.sha }}
          path: .engine
          persist-credentials: false
      - name: Validate deployment config against the engine
        env:
          ENGINE_ROOT: .engine
          ENGINE_REF: ${{ steps.lock.outputs.ref }}
        run: bash .engine/scripts/ci-deploy.sh --config "$UNIT" --engine-ref "$ENGINE_REF" --check-only
