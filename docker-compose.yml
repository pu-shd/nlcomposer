services:
  app:
    build: .
    image: newsletter-composer:dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./assets:/app/assets
      - sdc-data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SDC_DATA_DIR=/app/data

  tests:
    build: .
    image: newsletter-composer:dev
    command: pytest -q
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    profiles: ["test"]

volumes:
  sdc-data:
