name: Deploy to SDC Container App

# GitOps: every push to `main` (excluding docs-only changes) runs the test
# suite in Docker and, if it passes, builds the image in ACR and rolls a new
# Container App revision tagged with the commit SHA. `main` is the source of
# truth for what is running in production.
#
# Manual dispatch remains for re-deploys and the destructive database wipe.
# Dispatched runs must type confirm="deploy"; wipe_database=true additionally
# requires wipe_confirm="WIPE". The wipe step can never run on push.
#
# Required repo secrets (set by `scripts/deploy.sh setup` with suffix _SDC):
#   AZURE_CLIENT_ID_SDC, AZURE_TENANT_ID_SDC, AZURE_SUBSCRIPTION_ID_SDC,
#   AZURE_RESOURCE_GROUP_SDC, AZURE_ACR_NAME_SDC, AZURE_ACA_APP_SDC,
#   YOUTUBE_API_KEY_SDC
# Azure login uses the OIDC federated credential scoped to refs/heads/main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE.md"
      - "plan.txt"
      - "ralph.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm. Rolls a new container revision in PRODUCTION (SDC).'
        required: true
        default: ""
      image_tag:
        description: "Image tag to build and deploy (blank = commit SHA)"
        required: false
        default: ""
      wipe_database:
        description: 'DESTRUCTIVE: when "true", deletes app.db from the Azure Files share BEFORE deploy. All drafts/settings/archive lost.'
        required: false
        default: "false"
      wipe_confirm:
        description: 'Required when wipe_database is "true". Type "WIPE" to acknowledge the data loss.'
        required: false
        default: ""
      file_share:
        description: 'Azure Files share holding app.db. Only used when wipe_database=true.'
        required: false
        default: "sdc-data"

permissions:
  id-token: write
  contents: read

# Never run two deploys against the same Container App at once, and never
# cancel one mid-flight (a half-applied revision update is worse than a queue).
concurrency:
  group: deploy-sdc
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t nlcomposer-test .

      - name: Run test suite in Docker
        run: docker run --rm nlcomposer-test pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AZ_RG: ${{ secrets.AZURE_RESOURCE_GROUP_SDC }}
      AZ_ACR: ${{ secrets.AZURE_ACR_NAME_SDC }}
      AZ_APP: ${{ secrets.AZURE_ACA_APP_SDC }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Gate — confirm input
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          WIPE_DATABASE: ${{ inputs.wipe_database }}
          WIPE_CONFIRM: ${{ inputs.wipe_confirm }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Push to main — tests passed; deploying without manual confirmation."
            echo "Confirmation gate passed."
            exit 0
          fi
          echo "::warning::This workflow modifies the LIVE deployment. Review the inputs before proceeding."
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Confirm input must equal 'deploy' (case-sensitive). Got: '$CONFIRM'"
            exit 1
          fi
          if [ "$WIPE_DATABASE" = "true" ]; then
            echo "::warning::wipe_database=true — app.db will be DELETED before deploy."
            if [ "$WIPE_CONFIRM" != "WIPE" ]; then
              echo "::error::wipe_confirm must equal 'WIPE' (case-sensitive) when wipe_database is true. Got: '$WIPE_CONFIRM'"
              exit 1
            fi
          fi
          echo "Confirmation gate passed."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_SDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_SDC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_SDC }}

      - name: Wipe app.db on Azure Files share (DESTRUCTIVE — gated above)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.wipe_database == 'true' }}
        env:
          FILE_SHARE: ${{ inputs.file_share }}
        run: |
          echo "::warning::Deleting app.db on share '$FILE_SHARE'…"
          STORAGE=$(az storage account list \
            --resource-group "$AZ_RG" \
            --query "[?starts_with(name, 'st')].name | [0]" -o tsv)
          if [ -z "$STORAGE" ]; then
            echo "::error::Could not auto-detect storage account in the resource group."
            exit 1
          fi
          echo "Using storage account: $STORAGE"
          KEY=$(az storage account keys list \
            --resource-group "$AZ_RG" \
            -n "$STORAGE" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          if az storage file show --account-name "$STORAGE" --account-key "$KEY" \
               --share-name "$FILE_SHARE" --path app.db >/dev/null 2>&1; then
            az storage file delete --account-name "$STORAGE" --account-key "$KEY" \
              --share-name "$FILE_SHARE" --path app.db
            echo "app.db deleted."
          else
            echo "app.db was not present on the share — nothing to delete."
          fi

      - name: Build & push image to ACR
        run: |
          az acr build \
            --registry "$AZ_ACR" \
            --image "$AZ_APP:$IMAGE_TAG" \
            --file Dockerfile \
            .

      - name: Update Container App
        # `--revision-suffix` guarantees a new revision even when a dispatched
        # run reuses an image tag; ACA otherwise compares the template by
        # string and silently no-ops the update.
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY_SDC }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          az containerapp secret set \
            --name "$AZ_APP" \
            --resource-group "$AZ_RG" \
            --secrets "youtube-api-key=$YOUTUBE_API_KEY" \
            --output none

          SUFFIX="r${RUN_NUMBER}-${SHA:0:7}"
          az containerapp update \
            --name "$AZ_APP" \
            --resource-group "$AZ_RG" \
            --image "$AZ_ACR.azurecr.io/$AZ_APP:$IMAGE_TAG" \
            --revision-suffix "$SUFFIX" \
            --set-env-vars "YOUTUBE_API_KEY=secretref:youtube-api-key" \
            --output none

      - name: Show new revision
        run: |
          az containerapp revision list \
            --name "$AZ_APP" \
            --resource-group "$AZ_RG" \
            --query "[?properties.active].{name:name, created:properties.createdTime, image:properties.template.containers[0].image}" \
            -o table
