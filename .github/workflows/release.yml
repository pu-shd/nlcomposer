name: Release

# Tag vX.Y.Z on a commit that is on main → a GitHub release carrying
# template.lock ({repo, ref, sha}). Config repos pin that file; their
# update check opens a PR when a newer release exists, and merging that PR
# is the deploy. Nothing is pushed to a registry: each deployment builds the
# image in its own Azure Container Registry from the pinned commit.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build -t nlcomposer-test .
      - name: Run test suite in Docker
        # zsh for the deploy.sh tests; NLC_FAIL_ON_SKIP turns any skipped test into a failure.
        run: |
          docker run --rm -e NLC_FAIL_ON_SKIP=1 nlcomposer-test sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends zsh >/dev/null && pytest -q -rs'

  release:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is vX.Y.Z and its commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
            || { echo "::error::$TAG ($GITHUB_SHA) is not on main: merge first, then tag the merged commit"; exit 1; }
      - name: Publish release with template.lock
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$TAG" --arg sha "$GITHUB_SHA" \
            '{repo: $repo, ref: $ref, sha: $sha}' > template.lock
          {
            echo "Pin this release in a config repo's template.lock (its update check opens the PR for you):"
            echo
            echo '```json'
            cat template.lock
            echo '```'
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag template.lock
